st="spacing" textLength="306.9092" x="5216.05" y="500.5272">thread and awaits process exit without blocking.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.6147" x="5216.05" y="515.8377">Timeout and caller cancellation both kill the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.2598" x="5216.05" y="531.1483">process tree, but remain distinct outcomes.</text></g><g class="entity" data-qualified-name="GMN42" data-source-line="172" id="ent0043"><path d="M5534.15,187.5783 L5534.15,243.5099 L5919.8419,243.5099 L5919.8419,197.5783 L5909.8419,187.5783 L5534.15,187.5783" fill="#FFF7D6" style="stroke:#D4B106;stroke-width:0.5;"/><path d="M5909.8419,187.5783 L5909.8419,197.5783 L5919.8419,197.5783 L5909.8419,187.5783" fill="#FFF7D6" style="stroke:#D4B106;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.5322" x="5540.15" y="205.1466">Legacy wrapper preserved as the image API.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.6694" x="5540.15" y="220.4572">Process execution now flows through</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.6919" x="5540.15" y="235.7677">typed RaiImage command -&gt; CliCommand -&gt; RaiSystem.</text></g><!--reverse link CliCommand to CurlCommand--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="extension" data-source-line="137" id="lnk19"><path codeLine="137" d="M2023.2,133.3983 C1329.25,133.3983 80,133.3983 80,133.3983 C80,133.3983 80,415.3183 80,486.8983" fill="none" id="CliCommand-backto-CurlCommand" style="stroke:#9B2C2C;stroke-width:1;"/><polygon fill="none" points="2041.2,133.3983,2023.2,127.3983,2023.2,139.3983,2041.2,133.3983" style="stroke:#9B2C2C;stroke-width:1;"/></g><!--reverse link CliCommand to RCloneComma