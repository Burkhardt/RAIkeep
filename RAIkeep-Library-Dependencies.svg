="spacing" textLength="211.862" x="12" y="142.468">Foundation library for OS, paths,</text><text fill="#000000" font-family="'Casual'" font-size="14" lengthAdjust="spacing" textLength="252.994" x="12" y="156.734">files, temp files, reusable typed config,</text><text fill="#000000" font-family="'Casual'" font-size="14" lengthAdjust="spacing" textLength="160.216" x="12" y="171">and cloud-root discovery.</text></g><g class="entity" data-qualified-name="GMN52" data-source-line="106" id="ent0053"><path d="M1374.59,362.058 L1374.59,414.856 L1629.404,414.856 L1629.404,372.058 L1619.404,362.058 L1374.59,362.058" fill="#FFF7D6" filter="url(#fgpj9f2tscf0h)" style="stroke:#D4B106;stroke-width:0.5;"/><path d="M1619.404,362.058 L1619.404,372.058 L1629.404,372.058 L1619.404,362.058" fill="#FFF7D6" style="stroke:#D4B106;stroke-width:1;"/><text fill="#000000" font-family="'Casual'" font-size="14" lengthAdjust="spacing" textLength="233.814" x="1380.59" y="378.258">Utility library with JSON conversion,</text><text fill="#000000" font-family="'Casual'" font-size="14" lengthAdjust="spacing" textLength="207.536" x="1380.59" y="392.524">randomization, parameter, email,</text><text fill="#000000" font-family="'Casual'" font-size="14" lengthAdjust="spacing" textLength="124.628" x="1380.59" y="406.79">and search helpers.</text></g><g class="entity" data-qualified-name="GMN55" data-source-line="112" id="ent0056"><path d="M902.45,659.838 L902.45,698.37 L1217.548,698.37 L1217.548,669.838 L1207.548,659.838 L902.45,659.838" fill="#FFF7D6" filter="url(#fgpj9f2tscf0h)" style="stroke:#D4B106;stroke-width:0.5;"/><path d="M1207.548,659.838 L1207.548,669.838 L1217.548,669.838 L1207.548,659.838" fill="#FFF7D6" style="stroke:#D4B106;stroke-width:1;"/><text fill="#000000" font-family="'Casual'" font-size="14" lengthAdjust="spacing" textLength="294.098" x="908.45" y="676.038">JsonPit depends directly on OsLib and RaiUtils</text><text fill="#000000" font-family="'Casual'" font-size="14" lengthAdjust="spacing" textLength="291.564" x="908.45" y="690.304">for file/cloud conventions and utility helpers.</text></g><g class="entity" data-qualified-name="GMN58" data-source-line="117" id="ent0059"><path d="M1687.12,527.308 L1687.12,580.106 L2012.872,580.106 L2012.872,537.308 L2002.872,527.308 L1687.12,527.308" fill="#FFF7D6" filter="url(#fgpj9f2tscf0h)" style="stroke:#D4B106;stroke-width:0.5;"/><path d="M2002.872,527.308 L2002.872,537.308 L2012.872,537.308 L2002.872,527.308" fill="#FFF7D6" style="stroke:#D4B106;stroke-width:1;"/><text fill="#000000" font-family="'Casual'" font-size="14" lengthAdjust="spacing" textLength="286.594" x="1693.12" y="543.508">RaiImage references OsLib and RaiUtils when</text><text fill="#000000" font-family="'Casual'" font-size="14" lengthAdjust="spacing" textLength="304.752" x="1693.12" y="557.774">local projects are available, and can fall back</text><text fill="#000000" font-family="'Casual'" font-size="14" lengthAdjust="spacing" textLength="252.504" x="1693.12" y="572.04">to NuGet package references otherwise.</text></g><!--link P_OsLib to P_RaiUtils--><!--link P_RaiUtils to P_JsonPit--><!--link P_JsonPit to P_RaiUtils--><g class="link" data-entity-1="ent0020" data-entity-2="ent0014" data-link-type="dependency" data-source-line="94" id="lnk46"><path codeLine="94" d="M878.3931,554.108 C878.6504,554.108 878.9133,554.108 879.1817,554.108 C883.4759,554.108 889.1783,554.108 896.0819,554.108 C909.8891,554.108 928.5014,554.108 950.2641,554.108 C993.7894,554.108 1049.9163,554.108 1105.4075,554.108 C1216.39,554.108 1324.83,554.108 1324.83,554.108 C1324.83,554.108 1324.83,536.858 1324.83,510.983 C1324.83,498.0455 1324.83,482.9518 1324.83,466.7799 C1324.83,458.6939 1324.83,450.3385 1324.83,441.8482 C1324.83,440.787 1324.83,439.7236 1324.83,438.6583 C1324.83,438.1257 1324.83,443.5927 1324.83,443.0592" fill="none" id="P_JsonPit-to-P_RaiUtils" style="stroke:#9B2C2C;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#9B2C2C" points="1324.83,437.0592,1320.