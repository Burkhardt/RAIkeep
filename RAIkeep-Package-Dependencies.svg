D4B106;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.5645" x="543.72" y="591.8666">Utility library with JSON conversion,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.2373" x="543.72" y="607.1772">randomization, parameter, email,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.3032" x="543.72" y="622.4877">and search helpers.</text></g><g class="entity" data-qualified-name="GMN39" data-source-line="104" id="ent0040"><path d="M925.56,581.9483 L925.56,622.5694 L1240.4311,622.5694 L1240.4311,591.9483 L1230.4311,581.9483 L925.56,581.9483" fill="#FFF7D6" style="stroke:#D4B106;stroke-width:0.5;"/><path d="M1230.4311,581.9483 L1230.4311,591.9483 L1240.4311,591.9483 L1230.4311,581.9483" fill="#FFF7D6" style="stroke:#D4B106;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.8711" x="931.56" y="599.5166">JsonPit depends directly on OsLib and RaiUtils.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.2295" x="931.56" y="614.8272">Its tests also exercise those dependencies.</text></g><g class="entity" data-qualified-name="GMN42" data-source-line="109" id="ent0043"><path d="M1275.77,574.2983 L1275.77,630.2299 L1580.2373,630.2299 L1580.2373,584.2983 L1570.2373,574.2983 L1275.77,574.2983" fill="#FFF7D6" style="stroke:#D4B106;stroke-width:0.5;"/><path d="M1570.2373,574.2983 L1570.2373,584.2983 L1580.2373,584.2983 L1570.2373,574.2983" fill="#FFF7D6" style="stroke:#D4B106;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.4673" x="1281.77" y="591.8666">RaiImage references OsLib and RaiUtils when</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.2104" x="1