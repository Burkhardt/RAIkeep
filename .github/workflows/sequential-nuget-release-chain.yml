name: Sequential NuGet Release Chain

on:
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: "Push packed packages to NuGet"
        required: true
        default: false
        type: boolean

jobs:
  release-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Prepare artifacts
        shell: bash
        run: mkdir -p artifacts/nuget

      - name: Pack OsLibCore
        shell: bash
        run: |
          dotnet restore OsLib/OsLib.slnx
          dotnet build OsLib/OsLib.slnx --configuration Release --no-restore
          dotnet pack OsLib/OsLib.csproj --configuration Release --no-build --output artifacts/nuget

      - name: Publish OsLibCore
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          dotnet nuget push "artifacts/nuget/OsLibCore.*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      # Keep these waits: NuGet can take several minutes to index a newly pushed
      # package, and the next package in this chain restores against that version.
      - name: Wait for OsLibCore NuGet indexing
        if: inputs.publish_to_nuget
        shell: bash
        run: sleep 380

      - name: Verify OsLibCore flat-container package
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' OsLib/OsLib.csproj)"
          PACKAGE_ID="oslibcore"
          until [[ "$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID}/${VERSION}/${PACKAGE_ID}.${VERSION}.nupkg")" == "200" ]]; do
            sleep 10
          done

      - name: Pack RaiUtils
        shell: bash
        run: |
          dotnet restore RaiUtils/RaiUtils.slnx
          dotnet build RaiUtils/RaiUtils.slnx --configuration Release --no-restore
          dotnet pack RaiUtils/RaiUtils.csproj --configuration Release --no-build --output artifacts/nuget

      - name: Publish RaiUtils
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          dotnet nuget push "artifacts/nuget/RaiUtils.*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Wait for RaiUtils NuGet indexing
        if: inputs.publish_to_nuget
        shell: bash
        run: sleep 380

      - name: Verify RaiUtils flat-container package
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' RaiUtils/RaiUtils.csproj)"
          PACKAGE_ID="raiutils"
          until [[ "$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID}/${VERSION}/${PACKAGE_ID}.${VERSION}.nupkg")" == "200" ]]; do
            sleep 10
          done

      - name: Pack RaiImage
        shell: bash
        run: |
          dotnet restore RaiImage/RaiImage.slnx
          dotnet build RaiImage/RaiImage.slnx --configuration Release --no-restore
          dotnet pack RaiImage/RaiImage.csproj --configuration Release --no-build --output artifacts/nuget

      - name: Publish RaiImage
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          dotnet nuget push "artifacts/nuget/RaiImage.*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Wait for RaiImage NuGet indexing
        if: inputs.publish_to_nuget
        shell: bash
        run: sleep 380

      - name: Verify RaiImage flat-container package
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' RaiImage/RaiImage.csproj)"
          PACKAGE_ID="raiimage"
          until [[ "$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID}/${VERSION}/${PACKAGE_ID}.${VERSION}.nupkg")" == "200" ]]; do
            sleep 10
          done

      - name: Pack JsonPit
        shell: bash
        run: |
          dotnet restore JsonPit/JsonPit.slnx
          dotnet build JsonPit/JsonPit.slnx --configuration Release --no-restore
          dotnet pack JsonPit/JsonPit.csproj --configuration Release --no-build --output artifacts/nuget

      - name: Publish JsonPit
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          dotnet nuget push "artifacts/nuget/JsonPit.*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Wait for JsonPit NuGet indexing
        if: inputs.publish_to_nuget
        shell: bash
        run: sleep 380

      - name: Verify JsonPit flat-container package
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' JsonPit/JsonPit.csproj)"
          PACKAGE_ID="jsonpit"
          until [[ "$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID}/${VERSION}/${PACKAGE_ID}.${VERSION}.nupkg")" == "200" ]]; do
            sleep 10
          done

      - name: Pack ImgSeeder tool
        shell: bash
        run: |
          dotnet restore ImgSeeder/ImgSeeder.slnx /p:UseLocalRAIkeepSources=false
          dotnet build ImgSeeder/ImgSeeder.slnx --configuration Release --no-restore /p:UseLocalRAIkeepSources=false
          dotnet pack ImgSeeder/ImgSeeder.csproj --configuration Release --no-build /p:UseLocalRAIkeepSources=false

      - name: Publish ImgSeeder tool
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          dotnet nuget push "ImgSeeder/artifacts/nuget/ImgSeeder.*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Wait for ImgSeeder NuGet indexing
        if: inputs.publish_to_nuget
        shell: bash
        run: sleep 380

      - name: Verify ImgSeeder flat-container package
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' ImgSeeder/ImgSeeder.csproj)"
          PACKAGE_ID="imgseeder"
          until [[ "$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID}/${VERSION}/${PACKAGE_ID}.${VERSION}.nupkg")" == "200" ]]; do
            sleep 10
          done

      - name: Pack PitSeeder tool
        shell: bash
        run: |
          dotnet restore PitSeeder/PitSeeder.slnx /p:UseLocalRAIkeepSources=false
          dotnet build PitSeeder/PitSeeder.slnx --configuration Release --no-restore /p:UseLocalRAIkeepSources=false
          dotnet pack PitSeeder/pits/pits.csproj --configuration Release --no-build --output artifacts/nuget /p:UseLocalRAIkeepSources=false

      - name: Publish PitSeeder tool
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          dotnet nuget push "artifacts/nuget/PitSeeder.*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Wait for PitSeeder NuGet indexing
        if: inputs.publish_to_nuget
        shell: bash
        run: sleep 380

      - name: Verify PitSeeder flat-container package
        if: inputs.publish_to_nuget
        shell: bash
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' PitSeeder/pits/pits.csproj)"
          PACKAGE_ID="pitseeder"
          until [[ "$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID}/${VERSION}/${PACKAGE_ID}.${VERSION}.nupkg")" == "200" ]]; do
            sleep 10
          done

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sequential-nuget-release-chain
          path: |
            artifacts/nuget/*.nupkg
            ImgSeeder/artifacts/nuget/*.nupkg
