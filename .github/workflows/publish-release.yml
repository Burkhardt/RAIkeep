name: Publish synchronized RAIkeep release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@v5

      - name: Validate release notes and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          NOTES="doc/releases/v${MAJOR}.x/RAIkeep_RELEASE_NOTES_${MAJOR}.x.md"
          RELEASE_BODY="${RUNNER_TEMP}/RAIkeep-${VERSION}-release-notes.md"
          TITLE="RAIkeep ${TAG}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z tag, found ${TAG}."
            exit 1
          fi
          if [[ ! -f "${NOTES}" ]]; then
            echo "Missing synchronized release notes: ${NOTES}"
            exit 1
          fi
          python3 scripts/extract-release-notes.py "${NOTES}" "${VERSION}" "${RELEASE_BODY}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            EXISTING_TITLE="$(gh release view "${TAG}" --json name --jq '.name')"
            if [[ "${EXISTING_TITLE}" != "${TITLE}" ]]; then
              echo "Existing release title '${EXISTING_TITLE}' does not match '${TITLE}'."
              exit 1
            fi
            echo "Verified existing synchronized GitHub Release ${TITLE}."
          else
            gh release create "${TAG}" --title "${TITLE}" --notes-file "${RELEASE_BODY}"
          fi
