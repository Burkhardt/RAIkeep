name: Verify Ubuntu package provisioning
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/install-ubuntu-packages.sh
      - .github/workflows/verify-ubuntu-packages.yml
jobs:
  hosted-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/install-ubuntu-packages.sh graphviz ripgrep
      - run: dot -V && rg --version
  resolute:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      volumes:
        - /etc/ssl/certs:/etc/ssl/certs:ro
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Verify explicit Ubuntu 26.04 archive provisioning
        shell: bash
        run: |
          . /etc/os-release
          test "$VERSION_CODENAME" = resolute
          bash scripts/install-ubuntu-packages.sh graphviz ripgrep
          dot -V
          rg --version
