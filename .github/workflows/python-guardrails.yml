name: Python guardrails
on: [push, pull_request]
permissions:
  contents: read
jobs:
  vikela:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check-python-guardrails.py
